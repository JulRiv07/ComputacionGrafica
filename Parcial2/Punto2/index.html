<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <title>Graficador</title>
</head>
<body>

<h2>Graficador de puntos</h2>
<p class="subtitle">Ingresa las coordenadas para ubicar un punto</p>

<canvas id="canvas" width="600" height="400"></canvas>

<div id="controls">
    <div class="control">
        <label>X (1 - 166)</label>
        <input type="number" id="x" placeholder="Ej: 50" min="1" max="166">
    </div>

    <div class="control">
        <label>Y (1 - 99)</label>
        <input type="number" id="y" placeholder="Ej: 30" min="1" max="99">
    </div>
</div>

<div class="botones">
    <button id="Graficar" class="btn-primary">Graficar</button>
    <button id="Limpiar" class="btn-secondary">Limpiar</button>
</div>

<script src="js/script.js"></script>
</body>
</html>
