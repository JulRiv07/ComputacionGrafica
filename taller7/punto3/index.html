<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Games</title>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
<div class="container">
    <div id="carruselJuegos" class="carousel slide">
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#carruselJuegos" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carruselJuegos" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carruselJuegos" data-bs-slide-to="2"></button>
    </div>
    <div class="carousel-inner">
        <div class="carousel-item active">
        <img src="https://img.nerdburglars.net/wp-content/uploads/2023/06/nerdburglars_red_dead_redemption_poster_eb1acf05-fc22-4993-9897-a412663e3d5b.jpg" class="d-block w-100" alt="Shadow Realm">
        <div class="carousel-caption d-none d-md-block">
            <h5>Red Dead Redemption 2</h5>
            <p>Oeste salvaje, historia profunda y mundo abierto realista.</p>
        </div>
        </div>
        <div class="carousel-item">
        <img src="https://cdn.wccftech.com/wp-content/uploads/2024/09/Grand-Theft-Auto-V-HD-scaled.jpg" class="d-block w-100" alt="Cyber Warfare">
        <div class="carousel-caption d-none d-md-block">
            <h5>GTA V</h5>
            <p>Acción, crimen y caos en la icónica ciudad de Los Santos.</p>
        </div>
        </div>
        <div class="carousel-item">
        <img src="https://images4.alphacoders.com/601/601980.jpg" class="d-block w-100" alt="Dragon Keep">
        <div class="carousel-caption d-none d-md-block">
            <h5>GTA IV</h5>
            <p>Vive la historia de Niko Bellic en una ciudad llena de decisiones.</p>
        </div>
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carruselJuegos" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carruselJuegos" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
